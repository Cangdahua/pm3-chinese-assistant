name: 功能建议
description: 提议不削弱安全边界的新功能或改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请说明对危险命令授权、数据隐私和兼容性的影响。
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 此建议面向合法授权的设备和卡片使用场景。
          required: true
