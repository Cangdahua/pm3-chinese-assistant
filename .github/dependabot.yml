version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-build:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/pm3-qml-client"
    schedule:
      interval: weekly
    groups:
      python-runtime:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      prototype-frontend:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    groups:
      prototype-rust:
        patterns:
          - "*"
