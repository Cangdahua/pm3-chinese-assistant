name: Source-only release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-source:
    name: Publish complete source archive
    environment: source-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pm3-qml-client/requirements.txt
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0
      - name: Run main-client safety tests
        run: |
          python -m pip install -r pm3-qml-client/requirements.txt
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover \
            -s pm3-qml-client/tests -p 'test_*.py'
      - name: Enforce source-only publication boundary
        run: python tools/release_safety.py audit-source-release
      - name: Build complete deterministic source archive
        env:
          VERSION: ${{ github.ref_name }}
        run: python tools/build_source_archive.py --version "${VERSION#v}"
      - name: Publish only source archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find release/source -maxdepth 1 -type f -print | sort)
          test "${#files[@]}" -eq 2
          printf '%s\n' "${files[@]}" | grep -Eq -- '-source\.tar\.gz$'
          printf '%s\n' "${files[@]}" | grep -Eq -- '-source\.tar\.gz\.sha256$'
          if printf '%s\n' "${files[@]}" | grep -Eq '\.(dmg|zip|app)(\.|$)'; then
            echo "binary artifact reached the source-only release job" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --verify-tag \
            --title "$GITHUB_REF_NAME (source only)" \
            --generate-notes
